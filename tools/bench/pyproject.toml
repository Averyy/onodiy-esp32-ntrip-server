[project]
name = "onodiy-bench"
version = "0.1.0"
description = "Host-side bench tools for the UM982 + ESP32-S3 station: port finder, capture, receiver queries, RTCM inspection, station API dumps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Independent RTCM decoder, used only by the tests to cross-check the
    # frames they build and our own MSM decoding.
    "pyrtcm>=1.1",
    # tools/ci/ci_job.py reads build.yml with it (tests/test_ci_job.py).
    "pyyaml>=6",
]

[tool.uv]
# A set of scripts, not an installable package: `uv run <script>.py`.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
