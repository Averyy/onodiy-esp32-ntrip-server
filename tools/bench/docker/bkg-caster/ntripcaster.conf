# onocoydiy bench: configuration of the local BKG NtripCaster test peer.
# Our own file, written from the packaging README and the key names of its
# example configuration. Every value is a made-up bench value: never put a
# real caster's credentials here.

location onocoydiy-bench
rp_email bench@example.invalid
server_url http://localhost

max_clients 8
max_clients_per_source 8
max_sources 4

# Password every source (base station) sends; the caster has no source user
# names. At most 9 characters: tried against this build, a 10-character or
# longer one is always answered "ERROR - Bad Password".
encoder_password bench-src

# A machine name (no IP address). Inside the container the caster listens
# on 2101; run.sh publishes it on 127.0.0.1 only.
server_name localhost
port 2101

logdir /usr/local/ntripcaster/logs
logfile ntripcaster.log

# Mountpoints for clients: "/<mountpoint>" alone is open to every client.
/BENCH
