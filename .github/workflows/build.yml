name: build

on:
  # Docs-only changes run nothing; a tag push always runs (GitHub never filters tag pushes by path).
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "CONTRIBUTING.md", "docs/**", "gnss-splitter/**", "reference/**"]
  pull_request:
    paths-ignore: ["README.md", "CONTRIBUTING.md", "docs/**", "gnss-splitter/**", "reference/**"]
  # Weekly: the slow jobs (firmware-bench and the two QEMU ones) that a push to main skips.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# What a tag build produces is what stations are offered, so the build image
# is pinned by digest (a tag can be re-pushed): espressif/idf:v6.1, the image
# built 2026-08-26, by its multi-platform index (linux/amd64 and linux/arm64). To move
# to a newer image: docker pull espressif/idf:<tag>, then
#   docker image inspect espressif/idf:<tag> --format '{{index .RepoDigests 0}}'
# and use that digest in every job that runs in it (firmware, firmware-bench,
# host-tests, qemu-smoke, qemu-bench-console). tools/ci/host_tests_linux.sh
# and tools/ci/qemu_linux.sh read the image (and a container's options) and
# the steps of the host-tests and the two QEMU jobs from this file
# (tools/ci/ci_job.py runs the steps as the runner does: if: always(),
# continue-on-error, a step's timeout-minutes; it stands in for checkout,
# setup-uv and upload-artifact). It refuses, before the first step, whatever
# it would not run as CI does: another action or input, a matrix, a job
# timeout, a container key other than image and options, an expression it
# would have to evaluate, a workflow-level env: or defaults:. Such a change
# there needs it taught first.
#
# A push to main runs firmware, host-tests and bench-tools; firmware-bench and
# the two QEMU jobs run on tags, pull requests, the weekly run and on request
# (Actions > build > Run workflow), and a release needs every job.
#
# Jobs: firmware (the station image and every board's install files, uploaded), firmware-bench (the
# sdkconfig.bench overlay built and checked like the station image, so code
# that only bench builds compile cannot rot; nothing uploaded), host-tests,
# bench-tools (pytest), qemu-smoke, qemu-bench-console (the bench overlay
# run in QEMU: its console answers; then installed as on the 8 MB board),
# and release (tags only).
# Every action is pinned to a full commit SHA, with its version tag in a
# comment; to move one, look up the new tag's commit and change both.

jobs:
  firmware:
    name: Firmware (esp32s3)
    runs-on: ubuntu-24.04
    container: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c  # v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history + tags: `git describe` names dev builds

      - name: Layering lint
        shell: bash
        run: |
          # The configure step checks declared and linked dependencies between
          # our components; a relative path into another component would get
          # around it.
          if grep -rnE '#[[:space:]]*include[[:space:]]*"\.\./' components main; then
            echo "::error::relative #include across components: declare the dependency instead"
            exit 1
          fi
          if grep -nE '\.\./' components/*/CMakeLists.txt main/CMakeLists.txt; then
            echo "::error::relative path in a component CMakeLists.txt: declare the dependency instead"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          # Only tag builds are release versions (CMakeLists.txt checks the
          # format, the 31-character limit and that HEAD carries the tag);
          # everything else gets "<git describe>+dev".
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          ver_args=()
          if [ -n "$RELEASE_VERSION" ]; then
            ver_args=(-DRELEASE_VERSION="$RELEASE_VERSION")
          fi
          idf.py "${ver_args[@]}" set-target esp32s3 2>&1 | tee set-target.log
          idf.py "${ver_args[@]}" build 2>&1 | tee build.log
          # Unknown symbols, and known ones silently ignored because a
          # dependency is off, both mean sdkconfig.defaults is wrong.
          if grep -E "unknown kconfig symbol|but is not visible" set-target.log build.log; then
            echo "::error::sdkconfig.defaults sets a symbol this IDF version does not know or ignores"
            exit 1
          fi
          # Same arguments again: should anything trigger a reconfigure, it
          # must not rename the release image to a dev version.
          idf.py "${ver_args[@]}" size
          # The station image never carries the QEMU development options
          # (sdkconfig.qemu); a symbol leaking into sdkconfig.defaults would
          # build an image without Wi-Fi.
          if grep -E '^CONFIG_(NETWORK_QEMU_ETHERNET|ETH_USE_OPENETH)=y' sdkconfig; then
            echo "::error::the station build has the QEMU development options on (sdkconfig.qemu belongs to tools/qemu/run.sh only)"
            exit 1
          fi
          # Nor the bench and test options of the overlays (sdkconfig.bench,
          # sdkconfig.hold): the link's bench hooks, the held first receiver
          # configuration, the test-Onocoy caster slot. The station build
          # configures the receiver by itself at first boot.
          if grep -E '^CONFIG_(GNSS_LINK_BENCH_HOOKS|STATION_HOLD_FIRST_APPLY|NTRIP_TEST_ONOCOY_SLOT)=y' sdkconfig; then
            echo "::error::the station build has a bench-only option on (sdkconfig.bench / sdkconfig.hold belong to bench builds only)"
            exit 1
          fi
          # Nor the console's copy on the built-in USB (on in sdkconfig.bench)
          # or what it selects: the built-in USB kept running and the USB PHY
          # powered while Wi-Fi runs, which can lower Wi-Fi performance.
          if grep -E '^CONFIG_(DIAG_CONSOLE_USB_MIRROR|USJ_ENABLE_USB_SERIAL_JTAG|ESP_PHY_ENABLE_USB)=y' sdkconfig; then
            echo "::error::the station build keeps the built-in USB or the USB PHY on (sdkconfig.defaults turns both off; the console's copy on the built-in USB is for bench builds)"
            exit 1
          fi

      # Every board's install: the 8 MB table and one image per flash size for
      # 0x0. Fails when the app outgrows the smallest app slot (2.5 MB, the
      # 8 MB board's) or a bootloader does not validate for its flash size.
      - name: Install files
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          tools/ci/install_files.sh build install

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            install/partition-table-8mb.bin
            install/onodiy-install-16mb.bin
            install/onodiy-install-um980-ntrx.bin
            build/onodiy-esp32-ntrip-server.bin
            build/onodiy-esp32-ntrip-server.elf
            build/onodiy-esp32-ntrip-server.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
            build/config/sdkconfig.json
            THIRD_PARTY_NOTICES.md

  # The bench overlay (sdkconfig.bench: receiver flasher, bench console and
  # the console's copy on the built-in USB on) compiles code the station
  # image leaves out. Built with the same Kconfig check and -Werror on our
  # components; nothing is uploaded, and the release job does not depend on
  # it (a bench build is never released).
  firmware-bench:
    name: Firmware, bench overlay (esp32s3)
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    container: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c  # v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # git describe names the build

      - name: Build (bench overlay)
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -B build-bench -D SDKCONFIG=build-bench/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.bench" set-target esp32s3 2>&1 | tee set-target-bench.log
          idf.py -B build-bench -D SDKCONFIG=build-bench/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.bench" build 2>&1 | tee build-bench.log
          if grep -E "unknown kconfig symbol|but is not visible" set-target-bench.log build-bench.log; then
            echo "::error::sdkconfig.defaults or sdkconfig.bench sets a symbol this IDF version does not know or ignores"
            exit 1
          fi
          # The overlay was really applied: the bench options are on (the
          # console, the flasher, the link's bench hooks, the held first
          # receiver configuration, test-Onocoy caster slots, the console's
          # copy on the built-in USB).
          for opt in CONFIG_BENCH_CONSOLE CONFIG_UM98X_FLASH_ENABLE CONFIG_GNSS_LINK_BENCH_HOOKS \
                     CONFIG_STATION_HOLD_FIRST_APPLY CONFIG_NTRIP_TEST_ONOCOY_SLOT CONFIG_DIAG_CONSOLE_USB_MIRROR; do
            if ! grep -q "^$opt=y" build-bench/sdkconfig; then
              echo "::error::$opt is not on in build-bench/sdkconfig: the sdkconfig.bench overlay was not applied"
              exit 1
            fi
          done

  host-tests:
    name: Host unit tests (linux target)
    runs-on: ubuntu-24.04
    container: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c  # v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and run
        shell: bash
        working-directory: test/host
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py --preview set-target linux 2>&1 | tee set-target.log
          idf.py build 2>&1 | tee build.log
          if grep -E "unknown kconfig symbol|but is not visible" set-target.log build.log; then
            echo "::error::test/host/sdkconfig.defaults sets a symbol this IDF version does not know or ignores"
            exit 1
          fi
          ./build/onodiy_host_tests.elf

  bench-tools:
    name: Bench tools (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"  # pinned: a new uv release must not change the job without a commit

      - name: pytest
        working-directory: tools/bench
        # --locked: a pyproject.toml change without its uv.lock fails here instead of re-locking quietly
        run: uv run --locked pytest

  # The firmware in Espressif's QEMU (sdkconfig.qemu overlay, emulated
  # Ethernet instead of Wi-Fi): boots without a panic or a reboot loop, the
  # web server answers, and UART1 carries the receiver detection both ways.
  # A development check only; nothing here is released.
  qemu-smoke:
    name: QEMU smoke test
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c  # v6.1
      # e2e.py's stuck rover needs a bounded sender buffer: Linux lets QEMU's
      # socket to a rover that never reads take up to tcp_wmem's max (4 MB by
      # default), so the station's socket never stalls within the check. The
      # sysctl is per network namespace, allowed in an unprivileged container.
      options: --sysctl net.ipv4.tcp_wmem="4096 16384 65536"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # git describe names the build

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"

      - name: Build (QEMU overlay)
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # The image ships qemu-xtensa; install it only if a newer image does not.
          if ! command -v qemu-system-xtensa >/dev/null; then
            python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
            . "$IDF_PATH/export.sh"
          fi
          qemu-system-xtensa --version
          tools/qemu/run.sh --build-only 2>&1 | tee qemu-build.log
          if grep -E "unknown kconfig symbol|but is not visible" qemu-build.log; then
            echo "::error::sdkconfig.qemu sets a symbol this IDF version does not know or ignores"
            exit 1
          fi

      - name: Boot and check
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          uv run tools/qemu/smoke.py --out qemu-smoke

      # Recorded RTCM through the firmware to local casters (tools/qemu/README.md).
      - name: End to end
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          uv run tools/qemu/e2e.py --out qemu-e2e --scenario all

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qemu-smoke-${{ github.sha }}
          if-no-files-found: warn
          path: |
            qemu-build.log
            qemu-smoke/
            qemu-e2e/

  # The bench overlay in QEMU (sdkconfig.qemu plus sdkconfig.bench): the bench
  # console's command line answers on UART0 while the log keeps reaching the
  # console beside it, and its replies stay whole while another task floods
  # the log (tools/qemu/bench_console.py). Both use the console
  # UART's one driver, which only a running image shows; firmware-bench only
  # builds the overlay. A development check only; nothing here is released.
  qemu-bench-console:
    name: QEMU bench console
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    container: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c  # v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # git describe names the build

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"

      - name: Build (QEMU and bench overlays)
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # The image ships qemu-xtensa; install it only if a newer image does not.
          if ! command -v qemu-system-xtensa >/dev/null; then
            python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
            . "$IDF_PATH/export.sh"
          fi
          tools/qemu/run.sh --overlay sdkconfig.bench --build-only 2>&1 | tee qemu-bench-build.log
          if grep -E "unknown kconfig symbol|but is not visible" qemu-bench-build.log; then
            echo "::error::sdkconfig.qemu or sdkconfig.bench sets a symbol this IDF version does not know or ignores"
            exit 1
          fi

      - name: Bench console
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          uv run tools/qemu/bench_console.py --out qemu-bench-console

      # The same build installed as on the GNS NTRIP-X (partitions-8mb.csv,
      # 8 MB flash): the board found by its marker, no package area, and a
      # crash's core dump in its 128 KB partition (tools/qemu/board_8mb.py).
      - name: 8 MB board
        if: always()
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          uv run tools/qemu/board_8mb.py --out qemu-board-8mb

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qemu-bench-console-${{ github.sha }}
          if-no-files-found: warn
          path: |
            qemu-bench-build.log
            qemu-bench-console/
            qemu-board-8mb/

  # A tag vX.Y.Z[-PRE] becomes a GitHub Release with what stations download:
  # the app image the firmware job built as that release version, the receiver
  # package(s) from firmware/um982/ and manifest.json listing each with its
  # size and SHA-256 (tools/release_manifest.py; signed only when the
  # MANIFEST_SIGNING_KEY secret is set), plus the files for a first flash
  # over USB (one image per board's flash size, tools/ci/install_files.sh,
  # and the 16 MB install as separate files) and THIRD_PARTY_NOTICES.md; its notes start with the tag's
  # CHANGELOG.md section. A tag with "-PRE" is a pre-release:
  # stations read releases/latest only, so it is installed by manual upload.
  # The release is created as a draft and published once every file is
  # attached, so a station never sees a manifest without its files. Latest
  # goes to the highest vX.Y.Z published, never simply to the last one, so a
  # fix tagged on an older line does not replace a newer release for
  # stations. Needs contents: write and nothing else; it never changes
  # repository settings.
  release:
    name: GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [firmware, host-tests, bench-tools, firmware-bench, qemu-smoke, qemu-bench-console]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: firmware-${{ github.sha }}
          path: artifact

      - name: Refuse a development build
        shell: bash
        run: |
          set -euo pipefail
          # The QEMU development options (sdkconfig.qemu) replace Wi-Fi with an
          # Ethernet MAC no station has. tools/release_manifest.py refuses them
          # too; this names the problem before anything else runs.
          if python3 -c 'import json, sys; c = json.load(open(sys.argv[1])); sys.exit(1 if c.get("NETWORK_QEMU_ETHERNET") or c.get("ETH_USE_OPENETH") else 0)' \
               artifact/build/config/sdkconfig.json; then
            echo "station build: no QEMU development options"
          else
            echo "::error::this build has the QEMU development options (sdkconfig.qemu): never released"
            exit 1
          fi

      - name: Manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          # Optional (P-256 private key, PEM). Only a build with
          # CONFIG_FW_UPDATE_MANIFEST_KEY_1/_2 requires a signed manifest; the
          # tool refuses to write an unsigned one for such a build.
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          # Empty except for the release that moves stations to another
          # repository (docs/releases.md, "Keep the repository's name"): that build
          # reads releases from this owner/name instead of this repository.
          RELEASE_MOVE_TO: ${{ vars.RELEASE_MOVE_TO }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/manifest-key.pem"
          trap 'rm -f "$key"' EXIT
          sign_args=()
          if [ -n "${MANIFEST_SIGNING_KEY:-}" ]; then
            (umask 077 && printf '%s\n' "$MANIFEST_SIGNING_KEY" > "$key")
            sign_args=(--sign-key "$key")
          fi
          move_args=()
          if [ -n "${RELEASE_MOVE_TO:-}" ]; then
            move_args=(--move-to "$RELEASE_MOVE_TO")
          fi
          mkdir -p release
          python3 tools/release_manifest.py --version "$TAG" \
            --app artifact/build/onodiy-esp32-ntrip-server.bin \
            --gnss firmware/um982/*.pkg \
            --sdkconfig-json artifact/build/config/sdkconfig.json \
            --repo "$GITHUB_REPOSITORY" \
            --out release/manifest.json ${sign_args[@]+"${sign_args[@]}"} ${move_args[@]+"${move_args[@]}"}

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          a=artifact/build
          # First flash over USB: offsets and flash settings from the build.
          flash=$(jq -r '[.flash_files | to_entries[] | "\(.key) \(.value | split("/") | last)"] | join(" ")' \
            "$a/flasher_args.json")
          settings=$(jq -r '.flash_settings | "--flash-mode \(.flash_mode) --flash-size \(.flash_size) --flash-freq \(.flash_freq)"' \
            "$a/flasher_args.json")
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          upload="install onodiy-esp32-ntrip-server.bin from Settings → Install manually."
          pre=()
          latest=(--latest=false)
          if [[ "$TAG" =~ $stable ]]; then
            # Latest is what stations read: the highest vX.Y.Z published, this
            # one included, not the one published last.
            newest=$( { gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                          --limit 1000 --json tagName --jq '.[].tagName'; echo "$TAG"; } |
                      grep -E "$stable" | sort -V | tail -n 1)
            if [ "$newest" = "$TAG" ]; then
              latest=(--latest)
              offer="Update a station from Settings → Updates."
            else
              echo "::notice::$TAG is lower than $newest: published without becoming Latest"
              offer="Not the latest release ($newest is): $upload"
            fi
          else
            pre=(--prerelease)
            offer="Pre-release: $upload"
          fi
          # The highlights: the tag's section of CHANGELOG.md (fails without one, before anything is made).
          highlights=$(python3 tools/release_notes.py "$TAG")
          {
            echo "$highlights"
            echo
            echo "### Install"
            echo
            echo "$offer A new board: erase it, then write its image at 0x0 over USB."
            echo
            echo "UM982 board (AliExpress), UM980 board (Alibaba):"
            echo
            echo '```'
            echo "esptool --chip esp32s3 erase-flash"
            echo "esptool --chip esp32s3 write-flash 0x0 onodiy-install-16mb.bin"
            echo '```'
            echo
            echo "GNS NTRIP-X (8 MB flash):"
            echo
            echo '```'
            echo "esptool --chip esp32s3 erase-flash"
            echo "esptool --chip esp32s3 write-flash 0x0 onodiy-install-um980-ntrx.bin"
            echo '```'
            echo
            echo "The same 16 MB install as separate files:"
            echo
            echo '```'
            echo "esptool --chip esp32s3 write-flash $settings $flash"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" ${pre[@]+"${pre[@]}"} \
            "$a/onodiy-esp32-ntrip-server.bin" firmware/um982/*.pkg release/manifest.json \
            "$a/bootloader/bootloader.bin" "$a/partition_table/partition-table.bin" "$a/ota_data_initial.bin" \
            artifact/install/partition-table-8mb.bin artifact/install/onodiy-install-16mb.bin \
            artifact/install/onodiy-install-um980-ntrx.bin artifact/THIRD_PARTY_NOTICES.md
          # Always explicit: without it GitHub makes any newly published
          # release Latest, a lower one included.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest[@]}"
          if [ "${latest[0]}" = "--latest" ]; then
            now=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            [ "$now" = "$TAG" ] || { echo "::error::Latest is $now, not $TAG"; exit 1; }
          fi

      - name: Check the download path stations use
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Stations download without a token, so only a public repository can
          # be checked (and used).
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" ]; then
            echo "::warning::private repository: stations cannot download releases until it is public; not checked"
            exit 0
          fi
          # Every hop must pass the rules the firmware applies before it
          # connects (components/fw_update/release_url.c, fw_release_hop_ok),
          # or stations refuse the download: https, one of the hosts listed
          # there, no user info, and on github.com a path inside this
          # repository's /releases/ without dot segments or escapes.
          allowed=$(awk '/s_hosts\[.*\] = \{/{f=1} f{print} f&&/^};/{exit}' components/fw_update/release_url.c |
            grep -oE '"[A-Za-z0-9.-]+"' | tr -d '"')
          [ -n "$allowed" ] || { echo "::error::no host list found in release_url.c"; exit 1; }
          prefix="/${GITHUB_REPOSITORY,,}/releases/"
          check() {
            local url="$1" hops=0 code next rest host path tail
            while :; do
              rest="${url#https://}"
              host="${rest%%[/?#]*}"
              path="${rest:${#host}}"
              path="${path%%[?#]*}"
              if [[ "$url" != https://* ]] || ! grep -qixF -- "$host" <<<"$allowed"; then
                echo "::error::$1 leads to $host, which stations do not trust (components/fw_update/release_url.c)"
                return 1
              fi
              tail="${path:$(( ${#GITHUB_REPOSITORY} + 1 ))}"
              if [ "${host,,}" = github.com ] &&
                 { [[ "${path,,}" != "$prefix"* ]] || [[ "$tail" == *'/.'* || "$tail" == *'%'* || "$tail" == *'\'* ]]; }; then
                echo "::error::$1 leads to github.com$path, outside $GITHUB_REPOSITORY's releases: stations refuse it"
                return 1
              fi
              read -r code next < <(curl -sS -o /dev/null --max-time 120 -w '%{http_code} %{redirect_url}\n' "$url" || true)
              case "${code:-}" in
                301|302|303|307|308)
                  hops=$((hops + 1))
                  [ "$hops" -le 5 ] || { echo "::error::$1: more than 5 redirects"; return 1; }
                  url="$next" ;;
                200) echo "$1: ends on $host after $hops redirect(s)"; return 0 ;;
                *) echo "::error::$1: HTTP ${code:-none} from $host"; return 1 ;;
              esac
            done
          }
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          check "$base/download/$TAG/manifest.json"
          check "$base/download/$TAG/onodiy-esp32-ntrip-server.bin"
          for pkg in firmware/um982/*.pkg; do
            check "$base/download/$TAG/$(basename "$pkg")"
          done
          case "$TAG" in
            *-*) ;;
            *) check "$base/latest/download/manifest.json" ;;
          esac
